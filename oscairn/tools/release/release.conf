# Oscairn plugin release configuration.
#
# The ONE place holding this repo's release facts. When copying this release setup to
# another Oscairn plugin fork, edit only this file; build.sh, check_deps.py,
# licenses.sh, manifest.py and selfcheck.py stay generic.
#
# KEY=VALUE, one per line, comments on their own line: sourced by POSIX sh and
# parsed by the Python scripts the same way.

NAME=oscairn-setbfree
# File stem of each release asset: <NAME>-<platform>.clap

PACKAGE_ID=org.oscairn.setbfree
PACKAGE_NAME="setBfree"
PACKAGE_SUMMARY="The setBfree tonewheel organ and its Leslie effect, with Oscairn sound contexts."
# SPDX expression, as published in the packages repo (quoted: sourced by sh, and it has spaces):
LICENSE="GPL-2.0-or-later AND MIT"
# Every plugin in the bundle as "descriptor-file=kind" pairs (kind: synth | effect |
# note-effect); each plugin's own version is read from its clap_plugin_descriptor_t:
PLUGINS="oscairn/plugin.cpp=synth oscairn/leslie.cpp=effect"
# The package version is the CMake project version (it tracks the organ's own version):
PROJECT_VERSION_FILE=oscairn/CMakeLists.txt
SOURCE_URL=https://github.com/oscairn/setBfree
# Releases are tagged oscairn-vX.Y.Z (upstream v* tags exist in forks):
TAG_PREFIX=oscairn-
# CMake tree to configure, and the .clap it produces in the build dir (setBfree's
# Oscairn project lives in oscairn/; its module is named setbfree):
CMAKE_SOURCE_DIR=oscairn
CLAP_FILE=setbfree.clap
CLAP_VERSION_FILE=oscairn/third_party/clap/include/clap/version.h
OSCAIRN_CLAP_UPSTREAM=oscairn/third_party/oscairn-clap/upstream.json
# Asset dependencies as "id@version" pairs (from the published record; none so far):
ASSET_DEPS=
# Licence/notice files the binary needs, as "path=licenses-name" pairs -> licenses/<name>:
LICENSE_FILES="COPYING=setBfree-COPYING AUTHORS=setBfree-AUTHORS oscairn/third_party/clap/LICENSE=clap-LICENSE oscairn/third_party/oscairn-clap/LICENSE=oscairn-clap-LICENSE"
